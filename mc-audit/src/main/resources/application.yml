server:
  port: 8080
spring:
  application:
    name: mc-audit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/DB_AUDIT}
    username: ${DB_USERNAME:mcaudit}
    password: ${DB_PASSWORD:mcaudit-dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:saberpro}
    password: ${RABBITMQ_PASSWORD:saberpro-dev}
messaging:
  exchange: ${RABBITMQ_EXCHANGE:app.events}
management:
  endpoints:
    web:
      exposure:
        include: health